<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodCart Design System</title>
    <meta name="description" content="Tokens, Tailwind preset and React components for GoodCart." />
    <link rel="icon" href="./goodcart-logo.svg" />
    <script>
      try {
        const t = localStorage.getItem('gc-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
